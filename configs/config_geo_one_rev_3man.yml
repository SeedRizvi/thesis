# Multi-manoeuvre test: THREE orthogonal impulses over 1 GEO revolution.
# Total arc: 1.0 day (~1 GEO rev), partitioned into four propagation segments
# joined by three manoeuvres.
#
# Timeline (days from MJD_start):
#   [0.00 -> 0.15]  pre-manoeuvre segment (3.6 h)
#   [0.15]          manoeuvre 1: dv = [1, 0, 0] m/s
#   [0.15 -> 0.43]  segment 2 (6.72 h)
#   [0.43]          manoeuvre 2: dv = [0, 1, 0] m/s
#   [0.43 -> 0.71]  segment 3 (6.72 h)
#   [0.71]          manoeuvre 3: dv = [0, 0, 1] m/s
#   [0.71 -> 1.00]  segment 4 (6.96 h)

scenario_parameters:
  time_step: 60
  MJD_start: 59349.00
  MJD_end: 59349.15  # 3.6 h to first manoeuvre
  max_time_step: 60
  output_directory: out/

initial_orbtial_parameters:
  dim_state: 6
  initial_state: [
    42014290.0,
    0.0,
    3681524.0,
    0.0,
    3066.0,
    0.0
  ]
  initial_state_type: ECI

propagator_truth_settings:
  earth_gravity_model_order: 2
  earth_gravity_model_degree: 2
  third_body_attraction: false
  third_body_sun: false
  third_body_moon: false
  solid_earth_tide: false
  ocean_tide_loading: false
  solar_radiation_pressure: true
  atmospheric_drag: false
  relativity_effect: false
  srpCoef: 1.0
  srpArea: 10.0
  dragCoef: 2.0
  dragArea: 5.0
  satMass: 1000.0

supporting_files:
  gravity_file: ./auxdata/GGM03S.txt
  ephemeris_file: ./auxdata/linux_p1550p2650.440
  ERP_file: ./auxdata/cod21587.erp

ground_stations:
  - name: "New York"
    latitude: 40.7128
    longitude: -74.0060
    altitude: 0.0
  - name: "London"
    latitude: 51.5074
    longitude: -0.1278
    altitude: 0.0
  - name: "Tokyo"
    latitude: 35.6762
    longitude: 139.6503
    altitude: 0.0
  - name: "Sydney"
    latitude: -33.8688
    longitude: 151.2093
    altitude: 0.0
  - name: "Singapore"
    latitude: 1.3521
    longitude: 103.8198
    altitude: 0.0
  - name: "Sao Paulo"
    latitude: -23.5505
    longitude: -46.6333
    altitude: 0.0

fgo_parameters:
  use_range: true
  measurement_noise_deg: 0.00278
  range_noise_m: 100.0
  # Calibrated values (3x J2+SRP mismatch) - standard baseline
  process_noise_position: 0.00042
  process_noise_velocity: 0.000014
  initial_position_error: 1000.0
  initial_velocity_error: 1.0
  max_iterations: 50
  convergence_threshold: 0.001

manoeuvre_parameters:
  # List of manoeuvres applied in order. Each entry has:
  #   delta_v:        [dvx, dvy, dvz] in m/s applied at the end of its segment
  #   duration_after: days to propagate after the impulse (until next manoeuvre
  #                   or end of arc for the final entry)
  manoeuvres:
    - delta_v: [1.0, 0.0, 0.0]
      duration_after: 0.28  # 6.72 h to second manoeuvre
    - delta_v: [0.0, 1.0, 0.0]
      duration_after: 0.28  # 6.72 h to third manoeuvre
    - delta_v: [0.0, 0.0, 1.0]
      duration_after: 0.29  # 6.96 h final propagation
  epsilon: 0.5
  dv_initial_error: 0.1
  t_star_initial_error: 120.0
